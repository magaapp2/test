name: Perpetual Dual Stream

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: streaming-group
  cancel-in-progress: true

env:
  # نظام التحكم في تشغيل أو إيقاف البث (1 = شغال | 0 = متوقف)
  ENABLE_STREAM: 1

jobs:
  stream:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      actions: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 🧹 Delete Old Logs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1

      - name: 🔢 Initialize System States
        run: |
          if [ ! -f hashtag.txt ]; then
            echo "32" > hashtag.txt
          fi

      - name: System Setup
        run: |
          echo "1. Fixing Mirror Links..."
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          fi
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list || true
          
          echo "2. Updating Repositories..."
          sudo apt-get update -y
          
          echo "3. Installing Packages..."
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends xvfb ffmpeg pulseaudio unclutter xdotool curl
          
          echo "4. Setting up Audio..."
          pulseaudio -D --exit-idle-time=-1 --disallow-exit || true
          pactl load-module module-null-sink sink_name=Sink1

      - name: Python Setup
        run: pip install -U urllib3 chardet requests selenium pyvirtualdisplay

      - name: Create Python Script
        run: |
          cat << 'EOF' > main.py
          import os, subprocess, time, requests, signal, random, urllib.parse, sys
          import warnings
          warnings.filterwarnings("ignore")
          
          from pyvirtualdisplay import Display
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          # ==========================================
          # إعدادات البث والمروحة وروابط التحكم
          # ==========================================
          MASTER_CONTROL_URL = "https://meja.do.am/work/lives.txt"

          # رابط النشر الواحد المطلوب
          APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw9UHTHqH5kVUqw-cccZvlMoyQRKmUHpF4QwX6N52QehswPvP8nyoxAXUdfSHBGcmNF/exec"

          # قراءة مفتاح يوتيوب API من متغيرات البيئة في جيت هب
          YOUTUBE_API_KEY = os.environ.get('YOUTUBE_API_KEY', '')

          # مدة الجلسة الكلية لجيت هب: عشوائية بين 4 إلى 5 ساعات (بالثواني)
          TOTAL_SESSION_TIME = random.randint(4 * 3600, 5 * 3600)

          # مدة البث المباشر الواحد عشوائية بين 70 دقيقة (4200 ثانية) إلى 130 دقيقة (7800 ثانية)
          SINGLE_STREAM_DURATION = random.randint(70 * 60, 130 * 60)

          # تحكم في صوت مروحة الكمبيوتر
          FAN_VOLUME = 0.08 

          def kill_all(signum, frame):
              os._exit(0)

          signal.signal(signal.SIGTERM, kill_all)
          signal.signal(signal.SIGINT, kill_all)

          def get_stream_config(index):
              try:
                  res = requests.get(f"{MASTER_CONTROL_URL}?t={int(time.time())}", timeout=10)
                  lines = [l.strip() for l in res.text.strip().split('\n') if l.strip()]
                  if index - 1 < len(lines):
                      parts = lines[index - 1].split()
                      if len(parts) >= 2:
                          return parts[0], parts[1] # إرجاع الرابط، وحالة البث (0 أو 1)
              except Exception as e:
                  print(f"Error reading control file: {e}")
              return None, None

          def get_live_video_id():
              """جلب ID البث المباشر من الخلية B1 في جوجل شيت"""
              try:
                  sheet_id = "1aKuvK01gwipeXtRWNsPwJvEfsZqllUbR8OvbGoDRuD0"
                  url = f"https://docs.google.com/spreadsheets/d/{sheet_id}/gviz/tq?tqx=out:csv&sheet=Sheet1"
                  res = requests.get(url, timeout=10)
                  lines = res.text.split('\n')
                  if len(lines) > 0:
                      row = lines[0].replace('"', '').split(',')
                      if len(row) >= 2:
                          video_id = row[1].strip()
                          if video_id:
                              return video_id
              except Exception as e:
                  print(f"⚠️ Error reading Video ID from Sheet: {e}")
              return None

          def get_live_viewers(video_id):
              """جلب عدد المشاهدين الحقيقيين بدقة عبر يوتيوب API الرسمي"""
              if not video_id or not YOUTUBE_API_KEY:
                  return 150
              try:
                  url = f"https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id={video_id}&key={YOUTUBE_API_KEY}"
                  res = requests.get(url, timeout=10)
                  data = res.json()
                  if "items" in data and len(data["items"]) > 0:
                      details = data["items"][0].get("liveStreamingDetails", {})
                      concurrent_viewers = details.get("concurrentViewers")
                      if concurrent_viewers is not None:
                          return int(concurrent_viewers)
              except Exception as e:
                  print(f"⚠️ API Viewer fetch error: {e}")
              return 150

          def active_wait(driver, duration, stream_index):
              start_time = time.time()
              last_check_time = 0
              last_viewer_check = 0
              last_url = driver.current_url
              
              # الانتظار قليلاً حتى يتم إنشاء البث في الشيت وجلب الـ ID
              time.sleep(10)
              video_id = get_live_video_id()
              print(f"🎯 Target Live Video ID for monitoring: {video_id}")
              
              while time.time() - start_time < duration:
                  # النقر الأساسي
                  try:
                      driver.find_element(By.TAG_NAME, 'body').click()
                  except:
                      pass
                  
                  # النقر الإضافي كل 5 ثواني في أعلى 2% من الشاشة (الإحداثيات Y=15)
                  try:
                      driver.execute_script("var el = document.elementFromPoint(360, 15); if(el) el.click();")
                  except:
                      pass
                  
                  current_time = time.time()
                  elapsed_time = current_time - start_time
                  
                  # 1. فحص حالة البث من ملف التحكم كل 10 ثواني
                  if current_time - last_check_time > 10: 
                      last_check_time = current_time
                      new_url, status = get_stream_config(stream_index)
                      
                      if status == "0":
                          print(f"🛑 Control file requested STOP (status=0). Ending stream...")
                          break # إنهاء حلقة الانتظار لإيقاف البث فوراً
                      
                      if new_url and status == "1" and new_url != last_url:
                          try:
                              driver.delete_all_cookies()
                              driver.execute_script("window.localStorage.clear();")
                              driver.execute_script("window.sessionStorage.clear();")
                              driver.execute_cdp_cmd('Network.clearBrowserCache', {})
                              driver.execute_cdp_cmd('Network.clearBrowserCookies', {})
                              try:
                                  driver.get(new_url)
                              except:
                                  try: driver.execute_script("window.stop();")
                                  except: pass
                              last_url = new_url
                              print(f"🔄 URL updated dynamically to: {new_url}")
                          except Exception as e:
                              pass

                  # 2. فحص عدد المشاهدين: يبدأ بعد مرور 10 دقائق (600 ثانية)، ثم يتكرر كل دقيقتين (120 ثانية)
                  if elapsed_time >= 600:
                      if current_time - last_viewer_check > 120:
                          last_viewer_check = current_time
                          viewers = get_live_viewers(video_id)
                          print(f"👥 Current Live Viewers: {viewers}")
                          
                          if viewers < 100:
                              print(f"⚠️ Viewers ({viewers}) dropped below 100 threshold after 10m. Terminating stream session...")
                              break
                  else:
                      print(f"⏳ In grace period (First 10 mins). Elapsed: {int(elapsed_time)}s / 600s")
                  
                  time.sleep(5) # يتم الانتظار 5 ثواني ثم يتكرر النقر الأساسي والإضافي

          # ==========================================
          # دالة البث الرئيسية 
          # ==========================================
          def start_stream(youtube_key, sink_name, stream_index, apps_script_url, duration, stream_title=None):
              os.environ['PULSE_SINK'] = sink_name
              
              # الشاشة الخاصة باللعبة بمقاس 720x1280 بالطول
              disp1 = Display(visible=0, size=(720, 1280), backend='xvfb')
              disp1.start()
              
              subprocess.Popen(['unclutter', '-idle', '0', '-display', f":{disp1.display}"])
              
              ffmpeg_proc = None
              fan_process = None
              driver1 = None
              
              print(f"🎯 Target Stream Duration: {duration} seconds ({duration/60:.2f} minutes).")

              try:
                  # إعدادات Chrome لتقليل استهلاك المعالج لأقصى درجة وحظر الإشعارات تماماً
                  opts = Options()
                  opts.add_argument('--user-agent=ngrok-bypass-bot/1.0')
                  opts.add_argument('--no-sandbox')
                  opts.add_argument('--disable-dev-shm-usage')
                  opts.add_argument('--autoplay-policy=no-user-gesture-required')
                  opts.add_argument('--disable-notifications')
                  opts.add_argument('--disable-infobars')
                  opts.add_argument('--disable-extensions')
                  opts.add_argument('--disable-popup-blocking')
                  opts.add_argument('--disable-features=TranslateUI')
                  opts.add_argument('--disable-gpu') # الأهم لتقليل الضغط
                  opts.add_argument('--disable-software-rasterizer')
                  opts.add_argument('--window-size=720,1280')
                  opts.add_argument('--memory-pressure-off')
                  opts.add_argument('--disable-background-timer-throttling')
                  
                  # تفضيلات لإغلاق أي إشعارات أو نوافذ أذونات منبثقة نهائياً
                  prefs = {
                      "profile.default_content_setting_values.notifications": 2,
                      "profile.default_content_setting_values.geolocation": 2,
                      "profile.default_content_setting_values.media_stream": 1
                  }
                  opts.add_experimental_option("prefs", prefs)
                  
                  opts.add_experimental_option("excludeSwitches", ["enable-automation"])
                  opts.add_experimental_option('useAutomationExtension', False)
                  opts.add_argument('--disable-blink-features=AutomationControlled')
                  opts.add_argument('--hide-scrollbars')
                  opts.add_argument('--kiosk')
                  opts.add_argument('--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36 CustomBot/1.0')

                  # تشغيل متصفح اللعبة
                  os.environ['DISPLAY'] = f":{disp1.display}"
                  driver1 = webdriver.Chrome(options=opts)
                  driver1.set_window_size(720, 1280)
                  # تخطي صفحة تحذير ngrok تلقائياً
                  driver1.execute_cdp_cmd('Network.setExtraHTTPHeaders', {'headers': {'ngrok-skip-browser-warning': 'true'}})
                  
                  # تحديد وقت أقصى لتحميل الصفحة لمنع التعليق
                  driver1.set_page_load_timeout(45)
                  
                  separator = "&" if "?" in apps_script_url else "?"
                  trigger_url = f"{apps_script_url}{separator}nocache={int(time.time())}"
                  if stream_title:
                      trigger_url += f"&title={urllib.parse.quote(stream_title)}"
                      
                  print(f"🔗 Opening Publishing Link in Game Browser to create NEW stream: {trigger_url}")
                  try:
                      driver1.get(trigger_url)
                  except:
                      try: driver1.execute_script("window.stop();")
                      except: pass
                  
                  print("⏳ Waiting 15 seconds for stream and broadcast setup...")
                  time.sleep(15)
                  
                  target_url, status = get_stream_config(stream_index)
                  if target_url:
                      print(f"📺 Navigating to Game Content: {target_url}")
                      try:
                          driver1.get(target_url)
                      except:
                          try: driver1.execute_script("window.stop();")
                          except: pass
                      time.sleep(8)
                      
                      # ===============================================
                      # الحل باستخدام أزرار الكيبورد: Tab مرتين ثم Enter
                      # ===============================================
                      print("⌨️ Pressing Tab twice and Enter to accept prompt...")
                      try:
                          os.system("xdotool key Tab Tab Tab Return")
                      except:
                          pass

                  # تشغيل صوت المروحة
                  fan_cmd = [
                      'ffplay', '-f', 'lavfi', 
                      '-i', f'anoisesrc=a={FAN_VOLUME}:c=pink,lowpass=f=800,tremolo=f=0.04:d=0.6', 
                      '-nodisp', '-loop', '0', '-loglevel', 'quiet'
                  ]
                  fan_env = os.environ.copy()
                  fan_env['PULSE_SINK'] = sink_name
                  fan_process = subprocess.Popen(fan_cmd, env=fan_env)

                  # التسجيل المباشر للشاشة مع قص الجزء العلوي (شريط الروابط والعناوين) وتعديل الفلاتر
                  ffmpeg_cmd = [
                      'ffmpeg', '-y',
                      '-nostats', '-loglevel', 'error',
                      '-thread_queue_size', '1024', # بفر أقوى للمدخلات
                      '-f', 'x11grab',
                      '-draw_mouse', '0',            # إخفاء الماوس لتقليل الرندر
                      '-framerate', '60',
                      '-video_size', '720x1280',
                      '-i', f":{disp1.display}",
                      '-thread_queue_size', '1024', # بفر أقوى للصوت
                      '-f', 'pulse',
                      '-i', f"{sink_name}.monitor",
                      '-map', '0:v',
                      '-map', '1:a',
                      
                      # فلتر لقص 80 بكسل من الأعلى لإخفاء شريط العنوان/الروابط، وتثبيت 60 فريم، وتظليل أسفل الشاشة
                      '-vf', 'crop=720:1200:0:100,scale=720:1280,fps=60,drawbox=x=0:y=1152:w=720:h=128:color=black:t=fill',
                      
                      '-c:v', 'libx264',
                      '-preset', 'ultrafast',
                      '-tune', 'zerolatency',
                      '-x264-params', 'threads=2:sliced-threads=1', # تنظيم استخدام المعالج
                      '-max_muxing_queue_size', '1024',             # بفر للمخرجات لمنع السقوط
                      
                      '-b:v', '3000k',    # سرعة رفع 3000 ثابتة
                      '-maxrate', '3000k',
                      '-bufsize', '6000k', # بفر مضاعف لضمان استقرار البت ريت
                      '-r', '60',
                      '-g', '120',
                      '-keyint_min', '120',
                      '-sc_threshold', '0',
                      '-pix_fmt', 'yuv420p',
                      '-c:a', 'aac',
                      '-b:a', '128k',
                      '-f', 'flv',
                      f"rtmp://a.rtmp.youtube.com/live2/{youtube_key}"
                  ]

                  ffmpeg_proc = subprocess.Popen(ffmpeg_cmd)
                  active_wait(driver1, duration, stream_index)

              except Exception as e:
                  print(f"Stream encountered an error: {e}")
              finally:
                  if fan_process:
                      fan_process.terminate()
                  if ffmpeg_proc:
                      ffmpeg_proc.kill()
                  try:
                      if driver1: driver1.quit()
                  except:
                      pass
                  disp1.stop()
                  print("🛑 Stream ended successfully.")

          if __name__ == "__main__":
              ENABLE_STREAM = os.environ.get('ENABLE_STREAM', '1') == '1'
              
              current_key = os.environ.get('R1')
              
              if ENABLE_STREAM and current_key:
                  try:
                      with open("hashtag.txt", "r") as f:
                          hashtag_num = int(f.read().strip())
                  except:
                      hashtag_num = 32
                      
                  stream_title = f"Snake game breaks world record #{hashtag_num}"
                  
                  # ==========================================
                  # جلب الروابط واختيار واحد عشوائي
                  # ==========================================
                  random_index = 1
                  try:
                      res = requests.get(f"{MASTER_CONTROL_URL}?t={int(time.time())}", timeout=10)
                      valid_lines = [l.strip() for l in res.text.strip().split('\n') if l.strip()]
                      if valid_lines:
                          random_index = random.randint(1, len(valid_lines))
                          print(f"🎲 Randomly selected stream index: {random_index} out of {len(valid_lines)} available links.")
                      else:
                          print("⚠️ Control file is empty, defaulting to index 1.")
                  except Exception as e:
                      print(f"⚠️ Error fetching lines to pick randomly: {e}. Defaulting to index 1.")

                  # فحص حالة البث للرابط العشوائي المختار
                  _, init_status = get_stream_config(random_index)
                  
                  if init_status == "0":
                      print(f"⚠️ Selected stream (Index {random_index}) is set to 0 in control file. Exiting...")
                  else:
                      print(f"🚀 Starting NEW Stream Session (Duration: {SINGLE_STREAM_DURATION/60:.1f} mins) within GitHub Session (Total: {TOTAL_SESSION_TIME/3600:.1f} hours)...")
                      start_stream(current_key, "Sink1", random_index, APPS_SCRIPT_URL, SINGLE_STREAM_DURATION, stream_title=stream_title)
                      
                      # حفظ الهاشتاج فقط إذا تم تشغيل البث
                      with open("hashtag.txt", "w") as f:
                          f.write(str(hashtag_num + 1))
              else:
                  print(f"⚠️ Stream key for R1 is missing or stream is disabled.")

          EOF

      - name: Run Streaming Script
        env:
          R1: ${{ secrets.R1 }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ENABLE_STREAM: ${{ env.ENABLE_STREAM }}
        run: python main.py

      - name: 💾 Commit Updated State Files
        if: always()
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add hashtag.txt
          git commit -m "Update stream hashtag" || echo "No changes to commit"
          git push

      - name: 🔄 Trigger Next Session Immediately (24/7 Loop)
        if: always()
        run: |
          echo "🔄 Launching next workflow session to keep 24/7 continuous streaming..."
          curl -s -X POST \
            -H "Authorization: token ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/$(basename ${{ github.workflow_ref }})/dispatches \
            -d '{"ref":"main"}' || true
